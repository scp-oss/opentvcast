name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  core-tests:
    name: :core contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # :core is a plain Kotlin/JVM module, so this needs no Android SDK and is
      # the fastest meaningful gate in the pipeline. If it fails, the contracts
      # every protocol implements are broken and nothing downstream will pass.
      - name: Run :core tests
        run: ./gradlew :core:test --stacktrace

      - name: Upload :core test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
          retention-days: 30
          if-no-files-found: ignore

  jvm-tests:
    name: JVM protocol tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Compiles :core + :airplay + :dlna + :app sources together with the test
      # sources, so tests can reach `internal` declarations across modules.
      - name: Run JVM protocol test suite
        run: ./gradlew :test-runner:test --stacktrace

      - name: Upload JVM test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: test-runner/build/reports/tests/test/
          retention-days: 30
          if-no-files-found: ignore

  android-build:
    name: Android test, lint & debug APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            test_task: :app:testGoogletvDebugUnitTest
            lint_task: :app:lintGoogletvDebug
            assemble_task: :app:assembleGoogletvDebug
            apk_path: app/build/outputs/apk/googletv/debug/app-googletv-debug.apk
          - flavor: firetv
            test_task: :app:testFiretvDebugUnitTest
            lint_task: :app:lintFiretvDebug
            assemble_task: :app:assembleFiretvDebug
            apk_path: app/build/outputs/apk/firetv/debug/app-firetv-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper executable
        run: chmod +x gradlew

      # NDK and CMake are required by :airplay (libplayfair.so, libalac.so) and
      # must match the versions pinned in airplay/build.gradle.kts. Without them
      # the assemble task fails.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The module-native unit tests run here rather than in the SDK-free job,
      # because :platform and :airplay are android-library modules. Running
      # :test-runner alone would not catch a broken module boundary or a UI-layer
      # compile error — both of which have shipped past this pipeline before.
      - name: Run module unit tests
        run: ./gradlew :platform:testDebugUnitTest :airplay:testDebugUnitTest ${{ matrix.test_task }} --stacktrace

      # androidTest compile gate: instrumented tests never run on CI (no
      # emulator), and their sources used to rot silently — a stale test sat
      # in a dead package referencing deleted view ids and did not compile
      # for months. Compiling the androidTest APK catches that.
      - name: Compile instrumented tests
        if: matrix.flavor == 'googletv'
        run: ./gradlew :app:assembleGoogletvDebugAndroidTest --stacktrace

      - name: Lint and build debug APKs
        run: ./gradlew ${{ matrix.lint_task }} ${{ matrix.assemble_task }} --stacktrace

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: ${{ matrix.apk_path }}
          retention-days: 7
